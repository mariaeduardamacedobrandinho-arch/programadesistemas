
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Soma de Números</title>
</head>
<body>

    <h2>Calcular Soma</h2>

    <input type="text" id="numero1" placeholder="Primeiro número">

    <br><br>

    <input type="text" id="numero2" placeholder="Segundo número">

    <br><br>

    <button id="botao">Calcular</button>

    <p id="resultado"></p>

    <script>

        const numero1 = document.querySelector("#numero1");
        const numero2 = document.querySelector("#numero2");
        const botao = document.querySelector("#botao");
        const resultado = document.querySelector("#resultado");

        numero1.addEventListener("input", function() {
            numero1.value = numero1.value.replace(/[^0-9]/g, "");
        });

        numero2.addEventListener("input", function() {
            numero2.value = numero2.value.replace(/[^0-9]/g, "");
        });

        botao.addEventListener("click", function() {

            if (numero1.value === "" || numero2.value === "") {

                resultado.textContent = "Preencha os dois campos!";

            } else {

                const valor1 = Number(numero1.value);
                const valor2 = Number(numero2.value);

                const soma = valor1 + valor2;

                resultado.textContent = "A soma é: " + soma;

                numero1.value = "";
                numero2.value = "";

            }

        });

    </script>

</body>
</html>
